name: mitou-comparison
on:
  workflow_dispatch:
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated users and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3 bubblewrap acl
          sudo useradd -r -M -s /bin/sh _guardrun
          echo 'runner ALL=(_guardrun) NOPASSWD: ALL' | sudo tee /etc/sudoers.d/mitou-guardrun
          sudo chmod 440 /etc/sudoers.d/mitou-guardrun
          mkdir -p results
          uname -a > results/environment.txt
          bwrap --version >> results/environment.txt
      - name: Prove namespace can start
        run: |
          sudo -n -u _guardrun bwrap --ro-bind / / --unshare-pid --unshare-net --proc /proc true
      - name: Run frozen A B C comparison
        run: |
          python3 comparison/full.py comparison/frozen-20260926 > results/full.jsonl 2> results/stderr.txt
      - name: Validate completed trials independently
        if: always()
        run: |
          python3 comparison/check_full.py results/full.jsonl > results/validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mitou-${{ matrix.os }}
          path: results/
